name: Release

# Publica uma versão nova: mude "version" no package.json, faça commit e envie a tag.
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Uma versão do Electron para cada sistema:
        #   • Windows: 33 (da package.json). Do 38 em diante a captura de tela no Windows cai de ~58
        #     para ~37 fps (medido com o mesmo código).
        #   • Linux: 44. Roda como app Wayland nativo; no 33 (via XWayland) a captura pelo PipeWire
        #     derrubava o app logo depois de escolher a tela no Ubuntu 26.04.
        include:
          - os: windows-latest
            target: --win
            electron: ''
          - os: ubuntu-latest
            target: --linux
            electron: 44.11.5
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Trocar a versão do Electron
        if: matrix.electron != ''
        run: npm install --no-save electron@${{ matrix.electron }}
      - name: Empacotar
        run: npx electron-builder ${{ matrix.target }} --publish never ${{ matrix.electron != '' && format('-c.electronVersion={0}', matrix.electron) || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Criar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Hyperdesk ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
